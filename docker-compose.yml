services:
  hivecrypto:
    image: johpaz/hivecrypto:latest
    ports:
      - "18791:18791"
    volumes:
      - hivecrypto-data:/root/.hivecrypto
    environment:
      HIVE_HOST: 0.0.0.0
      HIVE_PORT: 18791
      # Ollama running on the host machine — host.docker.internal resolves via extra_hosts below
      OLLAMA_HOST: http://host.docker.internal:11434
      HIVE_PUBLIC_URL: ${HIVE_PUBLIC_URL:-}
      NO_BROWSER: "1"
      HIVE_UI_DIR: /app/ui
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
    healthcheck:
      test: [ "CMD-SHELL", "wget -O- http://127.0.0.1:18791/health 2>/dev/null | grep -q status" ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 15s

volumes:
  hivecrypto-data:
